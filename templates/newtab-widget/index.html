<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<style>
  /* Journey가 보내 주는 색으로 채워져요. 기본값은 미리보기용이에요. */
  :root { --text: #222; --muted: #888; --accent: #7c5cff; }
  html, body { margin: 0; height: 100%; background: transparent; color: var(--text);
    font: 13px -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif; }
  .wrap { height: 100%; display: grid; place-items: center; text-align: center; }
  h1 { margin: 0; font-size: 26px; color: var(--accent); }
  p { margin: 4px 0 0; color: var(--muted); }
  button { margin-top: 10px; border: 0; border-radius: 8px; padding: 6px 12px; cursor: pointer;
    background: color-mix(in srgb, var(--text) 10%, transparent); color: var(--text); font: inherit; }
</style>
</head>
<body>
<div class="wrap">
  <div>
    <h1 id="hi">안녕!</h1>
    <p id="count">0번 눌렀어요</p>
    <button id="btn">누르기</button>
  </div>
</div>
<script>
  let data = { count: 0 }
  const render = () => { document.getElementById('count').textContent = data.count + '번 눌렀어요' }

  // Journey → 위젯: 테마·설정·저장해 둔 데이터
  addEventListener('message', (e) => {
    const m = e.data
    if (!m || m.journey !== 'init') return
    for (const [k, v] of Object.entries(m.theme || {})) document.documentElement.style.setProperty('--' + k, v)
    document.getElementById('hi').textContent = '안녕, ' + (m.settings?.name || 'Journey') + '!'
    if (m.data) data = m.data
    render()
  })

  // 위젯 → Journey: 데이터 저장
  document.getElementById('btn').onclick = () => {
    data.count++
    render()
    parent.postMessage({ journey: 'save', data }, '*')
  }

  // 준비됐다고 알리면 Journey가 init을 보내 줘요
  parent.postMessage({ journey: 'ready' }, '*')
</script>
</body>
</html>
